<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades - FoxESS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <div class="layout">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Solar Monitor</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html">Dashboard Geral</a>
                <a href="unidades.html" class="active">Unidades</a>
                <a href="configuracoes.html">Configurações</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="topbar" style="justify-content: space-between;">
                <h1>Gerenciamento de Unidades</h1>
                <button class="btn btn-primary" onclick="showForm()">+ Nova Unidade</button>
            </header>

            <div class="content-wrapper">
                
                <div id="form-unidade" class="card mb-4" style="display: none;">
                    <h2>Cadastrar Nova Unidade</h2>
                    <form id="cadastro-form" onsubmit="salvarUnidade(event)">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Nome</label>
                                <input type="text" id="u-nome" required>
                            </div>
                            <div class="form-group">
                                <label>Endereço</label>
                                <input type="text" id="u-endereco">
                            </div>
                            <div class="form-group">
                                <label>Planta FoxESS ID</label>
                                <input type="text" id="u-plant-id">
                            </div>
                            <div class="form-group">
                                <label>Datalogger SN *</label>
                                <input type="text" id="u-datalogger" required>
                            </div>
                            <div class="form-group">
                                <label>Potência Instalada (kWp) *</label>
                                <input type="number" step="0.01" id="u-kwp" required>
                            </div>
                            <div class="form-group">
                                <label>Geração Esperada Anual (kWh) *</label>
                                <input type="number" step="0.01" id="u-kwh" required>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <button type="button" class="btn btn-secondary ml-2" onclick="hideForm()">Cancelar</button>
                        </div>
                        <p id="form-msg" class="mt-2"></p>
                    </form>
                </div>

                <div class="card list-card">
                    <table class="data-table" id="lista-unidades">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Datalogger SN</th>
                                <th>Potência (kWp)</th>
                                <th>Esperado Anual</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/unidades.js"></script>
</body>
</html>
